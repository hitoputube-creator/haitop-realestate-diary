name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply dated sticker schedule patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/components/DiaryList.jsx')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              "import { removeLocalJSON } from '../lib/uiState'\nimport CustomerMemoLookupModal from './CustomerMemoLookupModal'",
              "import { removeLocalJSON } from '../lib/uiState'\nimport { resolveOrCreateCustomer } from '../lib/customers'\nimport CustomerMemoLookupModal from './CustomerMemoLookupModal'",
              'customer helper import',
          )

          replace_once(
              "function Composer({ onSubmit, onCancel, disabled, allLinkKeys, onNavigate, onOpenTimelineForCustomer, onDirtyChange }) {",
              "function Composer({ onSubmit, onCancel, disabled, allLinkKeys, onNavigate, onOpenTimelineForCustomer, onDirtyChange, selectedDate }) {",
              'composer signature',
          )

          replace_once(
              "  const [sticker, setSticker] = useState(null)\n  const [linkKey, setLinkKey] = useState('')",
              "  const [sticker, setSticker] = useState(null)\n  const [scheduleDate, setScheduleDate] = useState('')\n  const [linkKey, setLinkKey] = useState('')",
              'schedule date state',
          )

          replace_once(
              "  const composerRef = useRef(null)\n\n  function resetComposerDraft() {",
              "  const composerRef = useRef(null)\n\n  const selectedDateKey = selectedDate\n    ? `${selectedDate.getFullYear()}-${String(selectedDate.getMonth() + 1).padStart(2, '0')}-${String(selectedDate.getDate()).padStart(2, '0')}`\n    : ''\n  const defaultScheduleDate = (() => {\n    if (!selectedDate) return ''\n    const next = new Date(selectedDate)\n    next.setDate(next.getDate() + 1)\n    return `${next.getFullYear()}-${String(next.getMonth() + 1).padStart(2, '0')}-${String(next.getDate()).padStart(2, '0')}`\n  })()\n\n  function resetComposerDraft() {",
              'schedule date helpers',
          )

          replace_once(
              "    setValue('')\n    setSticker(null)\n    setLinkKey('')",
              "    setValue('')\n    setSticker(null)\n    setScheduleDate('')\n    setLinkKey('')",
              'reset schedule date',
          )

          replace_once(
              "    Boolean(linkKey.trim()) ||\n    Boolean(sticker) ||\n    Boolean(pickedCustomerId) ||",
              "    Boolean(linkKey.trim()) ||\n    Boolean(sticker) ||\n    Boolean(scheduleDate) ||\n    Boolean(pickedCustomerId) ||",
              'dirty schedule date',
          )

          old_submit = """  async function handleSubmit() {
    const trimmed = value.trim()
    const trimmedName = name.trim()
    const trimmedPhone = phone.trim()
    const trimmedTitle = title.trim()
    if (!trimmed || submitting) return
    setSubmitting(true)
    setSubmitError('')
    try {
      await onSubmit(trimmed, writer, sticker, linkKey.trim(), photoFiles, trimmedName, trimmedPhone, trimmedTitle, diaryFiles, pickedCustomerId)
      resetComposerDraft()
    } catch (err) {
      setSubmitError(err.message || String(err))
    } finally {
      setSubmitting(false)
    }
  }"""

          new_submit = """  async function handleSubmit() {
    const trimmed = value.trim()
    const trimmedName = name.trim()
    const trimmedPhone = phone.trim()
    const trimmedTitle = title.trim()
    if (!trimmed || submitting) return
    if (sticker && !scheduleDate) {
      setSubmitError(`${sticker} 날짜를 선택해주세요.`)
      return
    }

    setSubmitting(true)
    setSubmitError('')
    let scheduledRowId = null
    try {
      let resolvedCustomerId = pickedCustomerId || null
      if (!resolvedCustomerId && (trimmedName || trimmedPhone)) {
        try {
          const customer = await resolveOrCreateCustomer({
            name: trimmedName,
            phone: trimmedPhone,
            manager: writer,
          })
          resolvedCustomerId = customer?.id || null
        } catch (customerError) {
          console.warn('[DiaryComposer] customer resolve failed:', customerError.message || customerError)
        }
      }

      const separateSchedule = Boolean(sticker && scheduleDate && scheduleDate !== selectedDateKey)
      if (separateSchedule) {
        const { data: scheduledRow, error: scheduleError } = await supabase
          .from('work_diary')
          .insert({
            content: trimmed,
            tags: extractTags(trimmed),
            status: 'normal',
            date: scheduleDate,
            writer,
            sticker,
            link_key: linkKey.trim(),
            customer_name: trimmedName || null,
            customer_phone: trimmedPhone || null,
            title: trimmedTitle || null,
            customer_id: resolvedCustomerId,
          })
          .select('id')
          .single()
        if (scheduleError) throw scheduleError
        scheduledRowId = scheduledRow?.id || null
      }

      // 다른 날짜의 계약·잔금·약속은 그 날짜에 별도 일정 메모로 저장하고,
      // 오늘 작성한 상담 메모에는 스티커를 붙이지 않는다.
      await onSubmit(
        trimmed,
        writer,
        separateSchedule ? null : sticker,
        linkKey.trim(),
        photoFiles,
        trimmedName,
        trimmedPhone,
        trimmedTitle,
        diaryFiles,
        resolvedCustomerId
      )
      resetComposerDraft()
    } catch (err) {
      if (scheduledRowId) {
        try {
          await supabase.from('work_diary').delete().eq('id', scheduledRowId)
        } catch {
          // 원본 메모 저장 실패 시 생성했던 일정 복사본을 가능한 범위에서 롤백한다.
        }
      }
      setSubmitError(err.message || String(err))
    } finally {
      setSubmitting(false)
    }
  }"""
          replace_once(old_submit, new_submit, 'composer submit')

          replace_once(
              "                    onClick={() => setSticker(isActive && opt.value !== null ? null : opt.value)}",
              "                    onClick={() => {\n                      const nextSticker = isActive && opt.value !== null ? null : opt.value\n                      setSticker(nextSticker)\n                      setScheduleDate((current) => nextSticker ? (current || defaultScheduleDate) : '')\n                    }}",
              'composer sticker click',
          )

          replace_once(
              """          </div>

          <div className=\"wd-field-row wd-field-row--link-search\">""",
              """          </div>

          {sticker && (
            <div className=\"wd-field-row\">
              <label htmlFor=\"wd-composer-schedule-date\">일정일</label>
              <input
                id=\"wd-composer-schedule-date\"
                type=\"date\"
                className=\"wd-composer-customer-input\"
                value={scheduleDate}
                onChange={(e) => setScheduleDate(e.target.value)}
                disabled={disabled || submitting}
                aria-label={`${sticker} 일정 날짜`}
              />
            </div>
          )}

          <div className=\"wd-field-row wd-field-row--link-search\">""",
              'schedule date input',
          )

          replace_once(
              """        <Composer
          key={composerKey}
          onSubmit={async""",
              """        <Composer
          key={composerKey}
          selectedDate={selectedDate}
          onSubmit={async""",
              'composer selected date prop',
          )

          path.write_text(text, encoding='utf-8')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Commit verified schedule change and restore workflow
        shell: bash
        run: |
          git config user.name "hitoputube-creator"
          git config user.email "hitoputube@gmail.com"
          git show HEAD^:.github/workflows/deploy.yml > .github/workflows/deploy.yml
          git add src/components/DiaryList.jsx .github/workflows/deploy.yml
          git commit -m "Make diary stickers create dated schedule memos"
          git push origin HEAD:main
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
